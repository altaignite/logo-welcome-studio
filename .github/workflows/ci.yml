# Runs on every push and pull request: the same checks a contributor runs locally.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
